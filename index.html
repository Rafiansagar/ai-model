<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>Caption test</h1>
    <p>Florence-2 base, running in this browser. Photos never leave your computer.</p>
  </div>

  <form class="engine" id="engine">
    <label>Device
      <select id="device">
        <option value="webgpu" selected>GPU (WebGPU)</option>
        <option value="wasm">CPU (wasm)</option>
      </select>
    </label>
    <label>Precision
      <select id="dtype">
        <option value="mixed">Mixed, smaller</option>
        <option value="fp32">Full (fp32)</option>
      </select>
    </label>
    <button id="load" type="submit">Download model</button>
  </form>

  <div class="status">
    <p id="status">Checking this browser for a saved model…</p>
    <div class="rail" id="rail" hidden><span id="railFill"></span></div>
    <ul class="files" id="files"></ul>
    <p class="storage"><span id="storage"></span> <button class="forget" id="forget" type="button" hidden>Remove saved model</button></p>
  </div>
</header>

<main class="room">
  <section class="wall" aria-label="Photo">
    <figure class="frame" id="drop" tabindex="0" role="button" aria-label="Choose a photo, or drop one here">
      <div class="mat" id="mat">
        <p class="empty">Drop a photo here,<br>or click to choose one.</p>
      </div>
    </figure>

    <div class="source">
      <label class="pick">Choose photo<input type="file" id="file" accept="image/*"></label>
      <form class="url" id="urlForm">
        <input type="url" id="url" placeholder="Or paste an image URL" aria-label="Image URL">
        <button type="submit">Use URL</button>
      </form>
    </div>
  </section>

  <aside class="label" aria-label="Caption">
    <p class="caption" id="caption" aria-live="polite">Load the model and add a photo. Its caption appears here.</p>

    <fieldset class="detail">
      <legend>Detail</legend>
      <label><input type="radio" name="task" value="&lt;CAPTION&gt;" checked><span>Short</span></label>
      <label><input type="radio" name="task" value="&lt;DETAILED_CAPTION&gt;"><span>Detailed</span></label>
      <label><input type="radio" name="task" value="&lt;MORE_DETAILED_CAPTION&gt;"><span>Most detailed</span></label>
    </fieldset>

    <dl class="facts">
      <div><dt>Time</dt><dd id="time">–</dd></div>
      <div><dt>Ran on</dt><dd id="ran">–</dd></div>
      <div><dt>Photo size</dt><dd id="size">–</dd></div>
    </dl>

    <button class="again" id="run" type="button" disabled>Caption again</button>
  </aside>
</main>

<script src="app.js?v=8"></script>
</body>
</html>
